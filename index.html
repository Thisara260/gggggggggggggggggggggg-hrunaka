
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>Hirunaka-MD BOT — Pair Device</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

    .logo-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(ellipse at top, #102844 0%, transparent 55%),
    #080b14;
  color: #f4f7ff;
  font-family: 'Poppins', sans-serif;
}

.container {
  width: 100%;
  max-width: 440px;
  padding: 32px 25px;
  border: 1px solid #263b59;
  border-radius: 24px;
  background: rgba(13, 20, 35, 0.96);
  box-shadow: 0 20px 70px #0008;
}

.logo {
  width: 76px;
  height: 76px;
  margin: 0 auto 18px;
  display: grid;
  place-items: center;
  border-radius: 22px;
  background: linear-gradient(135deg, #53e7ff, #7785ff);
  color: #07101c;
  font-size: 25px;
  font-weight: 800;
  box-shadow: 0 0 35px #53e7ff30;
}

h1 {
  text-align: center;
  font-size: 27px;
  font-weight: 800;
}

.subtitle {
  margin: 8px 0 27px;
  text-align: center;
  color: #99a9c2;
  font-size: 13px;
  line-height: 1.7;
}

label {
  display: block;
  margin-bottom: 9px;
  color: #dbe7f9;
  font-size: 13px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 15px;
  outline: none;
  border: 1px solid #30435f;
  border-radius: 12px;
  background: #080e1a;
  color: white;
  font: inherit;
  font-size: 14px;
  transition: border .2s;
}

input:focus {
  border-color: #53e7ff;
  box-shadow: 0 0 0 3px #53e7ff12;
}

.hint {
  margin: 9px 0 20px;
  color: #8394ae;
  font-size: 11px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(110deg, #53e7ff, #7785ff);
  color: #07101c;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .2s, opacity .2s;
}

button:hover {
  transform: translateY(-2px);
}

button:disabled {
  cursor: wait;
  opacity: .6;
  transform: none;
}

.result {
  display: none;
  margin-top: 22px;
  padding: 19px;
  border: 1px solid #254a56;
  border-radius: 14px;
  background: #0a1922;
  text-align: center;
}

.result.show {
  display: block;
}

.result-title {
  margin-bottom: 12px;
  color: #a6b9d2;
  font-size: 12px;
}

.code {
  overflow-wrap: anywhere;
  color: #53e7ff;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 3px;
}

.copy {
  margin-top: 15px;
  padding: 11px;
  background: #152c3b;
  color: #53e7ff;
  border: 1px solid #2c5266;
}

.message {
  margin-top: 15px;
  color: #9eb0c8;
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.message.error {
  color: #ff929b;
}

.footer {
  margin-top: 25px;
  text-align: center;
  color: #71829b;
  font-size: 11px;
}

.footer span {
  color: #53e7ff;
}
</style>
</head>

<body>
<main class="container">
  <div class="logo"><img src="https://cdn.corenexis.com/f/q4BjUXReafZ.png" alt="👑" class="logo-img"></div>

  <h1>Pair Your Device</h1>
  <p class="subtitle">
    Connect your WhatsApp account to your Hirunaka-MD Bot
    using a pairing code.
  </p>

  <form id="pairForm">
    <label for="number">WhatsApp Number</label>
    <input
      id="number"
      type="tel"
      placeholder="947XXXXXXXX"
      autocomplete="tel"
      inputmode="numeric"
      required
    >
    <p class="hint">
      Include your country code. Do not use +, spaces, or dashes.
    </p>

    <button id="submitBtn" type="submit">
      GET PAIRING CODE →
    </button>
  </form>

  <section id="result" class="result" aria-live="polite">
    <p class="result-title">YOUR PAIRING CODE</p>
    <div id="code" class="code"></div>
    <button id="copyBtn" class="copy" type="button">
      COPY CODE
    </button>
    <p id="message" class="message"></p>
  </section>

  <p class="footer">
    Powered by <span>Hirunaka-MD BOT</span> · Device Connection
  </p>
</main>

<script>
const API_URL = 'https://hirunaka-md-mini-bot.vercel.app/api/code';

const form = document.getElementById('pairForm');
const numberInput = document.getElementById('number');
const submitBtn = document.getElementById('submitBtn');
const result = document.getElementById('result');
const codeElement = document.getElementById('code');
const messageElement = document.getElementById('message');
const copyBtn = document.getElementById('copyBtn');

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const number = numberInput.value.replace(/\D/g, '');

  if (number.length < 8 || number.length > 15) {
    alert('Please enter a valid phone number with country code.');
    return;
  }

  result.classList.add('show');
  codeElement.textContent = '';
  messageElement.textContent = 'Requesting your pairing code...';
  messageElement.className = 'message';
  submitBtn.disabled = true;
  submitBtn.textContent = 'PLEASE WAIT...';

  try {
    const response = await fetch(
      `${API_URL}?number=${encodeURIComponent(number)}`,
      {
        method: 'GET',
        headers: {
          'Accept': 'application/json, text/plain'
        }
      }
    );

    const raw = await response.text();

    if (!response.ok) {
      throw new Error(`Server returned HTTP ${response.status}: ${raw}`);
    }

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      data = raw;
    }

    // Supports common JSON response formats.
    let pairingCode = '';

    if (typeof data === 'string') {
      pairingCode = data.trim();
    } else if (data && typeof data === 'object') {
      pairingCode =
        data.code ??
        data.pairingCode ??
        data.pairing_code ??
        data.pairCode ??
        '';
    }

    if (pairingCode) {
      codeElement.textContent = String(pairingCode);
      messageElement.textContent =
        'Open WhatsApp → Linked Devices → Link a Device → Link with phone number instead, then enter the code if prompted.';
    } else {
      messageElement.textContent =
        'The server responded, but no pairing code was found. Check the backend response format.';
      messageElement.className = 'message error';
    }

  } catch (error) {
    console.error('Pairing request failed:', error);

    messageElement.className = 'message error';
    messageElement.textContent =
      'Connection failed. Check your backend, HTTPS, and CORS settings. ' +
      'Details: ' + error.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'GET PAIRING CODE →';
  }
});

copyBtn.addEventListener('click', async () => {
  const code = codeElement.textContent.trim();

  if (!code) return;

  try {
    await navigator.clipboard.writeText(code);
    copyBtn.textContent = 'COPIED ✓';
  } catch {
    messageElement.textContent =
      'Copy failed. Please select and copy the code manually.';
  }

  setTimeout(() => {
    copyBtn.textContent = 'COPY CODE';
  }, 1800);
});
</script>
</body>
</html>
